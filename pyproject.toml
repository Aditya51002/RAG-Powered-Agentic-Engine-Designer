[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-phy"
version = "0.1.0"
description = "Grounded preliminary jet-engine design-space exploration prototype"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "CoolProp>=6.6,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "hypothesis>=6.100,<7",
    "mypy>=1.10,<2",
    "ruff>=0.11,<1",
    "types-PyYAML>=6.0",
]
knowledge = [
    "chromadb>=1.0,<2",
    "PyMuPDF>=1.24,<2",
]
embeddings = [
    "sentence-transformers>=3.0,<6",
]
orchestration = [
    "langgraph>=0.2,<2",
]
optimization = [
    "langgraph>=0.2,<2",
    "optuna>=4.0,<6",
]
evaluation = [
    "ragas>=0.4,<0.5",
    "matplotlib>=3.8,<4",
]
app = [
    "streamlit>=1.35,<2",
    "requests>=2.31,<3",
]
llm = [
    "anthropic>=0.70,<2",
]
api = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
