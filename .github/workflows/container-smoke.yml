name: Container smoke test

on:
  push:
    paths:
      - Dockerfile
      - docker-compose.yml
      - pyproject.toml
      - config/**
      - data/curated/corpus/**
      - scripts/**
      - src/rag_phy/**
      - .github/workflows/container-smoke.yml
  pull_request:
    paths:
      - Dockerfile
      - docker-compose.yml
      - pyproject.toml
      - config/**
      - data/curated/corpus/**
      - scripts/**
      - src/rag_phy/**
      - .github/workflows/container-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the Compose service
        run: docker compose up --build --detach

      - name: Wait for API readiness
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          until curl --fail --silent http://127.0.0.1:8000/health --output /tmp/rag-phy-health.json; do
            if (( SECONDS >= deadline )); then
              docker compose logs --no-color
              exit 1
            fi
            sleep 10
          done
          python3 -c 'import json; assert json.load(open("/tmp/rag-phy-health.json"))["status"] == "ready"'

      - name: Exercise indexed knowledge search
        run: |
          curl --fail --silent --get \
            --data-urlencode 'q=What are the five NASA SiC/SiC composite systems?' \
            http://127.0.0.1:8000/knowledge/search \
            --output /tmp/rag-phy-search.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          results = json.loads(Path("/tmp/rag-phy-search.json").read_text())
          assert results, "knowledge search returned no passages"
          assert all(result["text"].strip() for result in results)
          assert all(result["source_refs"] for result in results)
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Stop Compose and remove test volumes
        if: always()
        run: docker compose down --volumes --remove-orphans || true
